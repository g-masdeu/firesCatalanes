<div class="dashboard-horizontal">
  
  <header class="search-header">
    <div class="search-container">
      <div class="search-title-group">
        <h2 class="page-title">{{ titolPagina }}</h2>
      </div>

      <div class="filters-row">
        
        @if (tipus === 'comarca' || tipus === 'poblacio') {
          <div class="filter-item">
            <label class="modern-label">
              <span class="material-symbols-outlined">filter_list</span>
              Filtrar per {{ tipus }}
            </label>
            <div class="select-wrapper">
              <select (change)="onFilterChange($event)" class="modern-control">
                <option value="">-- Totes les opcions --</option>
                @for (opt of options; track opt) {
                  <option [value]="opt">{{ opt }}</option>
                }
              </select>
              <span class="material-symbols-outlined custom-arrow">expand_more</span>
            </div>
          </div>
        }

        
        @if (tipus === 'data') {
          <div class="filter-item">
            <label class="modern-label">
              <span class="material-symbols-outlined">calendar_today</span>
              Tria una data específica
            </label>
            <input type="date" (change)="onDateChange($event)" class="modern-control">
          </div>
        }

        
        <div class="results-stats">
          <span class="count">{{ filteredFairs.length }}</span> fires trobades
        </div>
      </div>
      
      @if (tipus === 'data') {
        <p class="date-hint">
          <span class="material-symbols-outlined">info</span>
          Cerca fires que coincideixin en dia i mes, sense importar l'any.
        </p>
      }
    </div>
  </header>

  
  <main class="results-container">
    <app-region-fairs-list [fairs]="filteredFairs"></app-region-fairs-list>
  </main>
</div>
